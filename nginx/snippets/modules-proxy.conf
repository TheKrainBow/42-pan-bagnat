        location / {
            # This edge gateway is intentionally NOT the enforcement point for
            # upload size: each module page's own gateway (net-controller-managed
            # nginx container) sets client_max_body_size per-page (default 1m,
            # admin-configurable, hard-capped server-side). Keeping this hop
            # unlimited avoids a silent, lower ceiling here shadowing a higher
            # limit an admin explicitly configured downstream.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass         http://pan-bagnat-proxy-service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_redirect     off;
        }
