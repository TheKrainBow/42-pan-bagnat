        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Allow large bodies only for icon upload endpoints
        location ~ ^/api/v1/admin/modules/[^/]+/icon/upload$ {
            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location ~ ^/api/v1/admin/modules/[^/]+/pages/[^/]+/icon/upload$ {
            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        # Module shell is a WebSocket; keep it alive while idle
        location ~ ^/api/v1/admin/modules/[^/]+/shell$ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        
        # Claude terminal is a WebSocket that may stay attached for hours while Claude works
        location ~ ^/api/v1/admin/modules/[^/]+/claude/sessions/[^/]+/terminal$ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        location = /api/v1/admin/dashboard/image/upload {
            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location /api/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location /auth/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location /oauth/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location /.well-known/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location /ws {
            proxy_pass         http://pan-bagnat-backend;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }

        # Serve backend-uploaded icons only; let the frontend own other /assets/*
        location ^~ /assets/module-icons/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location ^~ /assets/page-icons/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location ^~ /assets/dashboard-images/ {
            proxy_pass         http://pan-bagnat-backend;
            proxy_redirect     off;
        }

        location / {
            proxy_pass         http://pan-bagnat-frontend;
        }
