# No prefix key: every keystroke (Ctrl+B included) goes to claude.
set -g prefix None
unbind C-b
set -g status off
set -g mouse on
set -g history-limit 50000
# Esc must reach claude immediately (it interrupts the current task).
set -s escape-time 0
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g set-clipboard on
# Several browser tabs may be attached: size the window to the latest one.
set -g window-size latest
